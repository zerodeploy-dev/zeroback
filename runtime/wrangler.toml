name = "vex-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[durable_objects]
bindings = [{ name = "VEX_DO", class_name = "VexDO" }]

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantBackend"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "TenantBackend", to = "VexDO" }]
